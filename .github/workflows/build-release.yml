name: Build and release RBX Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.2.0)
        required: true
        default: v0.2.7
        type: string
      benchmark_only:
        description: Build and test without publishing a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-desktop

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test frontend
        run: npm test

      - name: Build Windows portable executable
        run: npm run desktop:build:portable

      - name: Test native code
        # Reuse Tauri's release dependencies and embedded frontend before publishing.
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --features tauri/custom-protocol

      - name: Collect portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/rbx-tools.exe" -Destination "release/RBX-Tools.exe"

      - name: Determine release target
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_only || false }}
        run: |
          $version = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($env:BENCHMARK_ONLY -eq "true") {
            $tag = "v$version"
            $publish = $false
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $publish = $true
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $publish = $true
          } else {
            $tag = "v$version"
            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $release = Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck
            if ($release.StatusCode -eq 200) {
              $publish = $false
            } elseif ($release.StatusCode -eq 404) {
              $publish = $true
            } else {
              throw "Release lookup failed with HTTP $($release.StatusCode)."
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBX-Tools-Windows-${{ github.run_number }}
          path: release/RBX-Tools.exe
          if-no-files-found: error
          compression-level: 1

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $files = @("release/RBX-Tools.exe")
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" -Headers $headers -SkipHttpErrorCheck
          if ($release.StatusCode -eq 200) {
            gh release upload $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --clobber
          } elseif ($release.StatusCode -eq 404) {
            gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RBX Tools $env:RELEASE_TAG" --generate-notes
          } else {
            throw "Release lookup failed with HTTP $($release.StatusCode)."
          }
