name: Build and release RBX Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.2.0)
        required: true
        default: v0.2.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons

      - name: Test frontend
        run: npm test

      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows app and installer
        run: npm run desktop:build

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/rbx-tools.exe" -Destination "release/RBX-Tools.exe"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS installer." }
          Copy-Item -LiteralPath $installer.FullName -Destination "release/RBX-Tools-Setup.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBX-Tools-Windows-${{ github.run_number }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $files = @("release/RBX-Tools.exe", "release/RBX-Tools-Setup.exe")
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RBX Tools $env:RELEASE_TAG" --generate-notes
          }
